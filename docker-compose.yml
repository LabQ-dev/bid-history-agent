# 나라장터 입찰참가 이력 검색 — 도커 구성
#
#   docker compose up -d --build     # 빌드 + 실행
#   docker compose logs -f collector # 수집기 로그
#   docker compose down              # 중지
#
# 데이터(SQLite)는 ./data 폴더에 저장됨 — 서버 이전 시 이 폴더만 복사하면 됨.
# 설정은 .env 파일 사용 (G2B_SERVICE_KEY, WEB_PASSWORD 등).

services:
  web:
    build: .
    container_name: bid-history-web
    ports:
      - "8931:8931"
    env_file: .env
    environment:
      WEB_HOST: 0.0.0.0
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  collector:
    build: .
    container_name: bid-history-collector
    command: ["python", "collector.py", "--daemon"]
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
